<svg
  [style.width]="dimension"
  [style.height]="dimension"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.75"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  <!-- menu -->
  <ng-container *ngIf="name === 'menu'">
    <line x1="3" y1="12" x2="21" y2="12"></line>
    <line x1="3" y1="6" x2="21" y2="6"></line>
    <line x1="3" y1="18" x2="21" y2="18"></line>
  </ng-container>

  <!-- close -->
  <ng-container *ngIf="name === 'close'">
    <line x1="18" y1="6" x2="6" y2="18"></line>
    <line x1="6" y1="6" x2="18" y2="18"></line>
  </ng-container>

  <!-- search -->
  <ng-container *ngIf="name === 'search'">
    <circle cx="11" cy="11" r="7"></circle>
    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
  </ng-container>

  <!-- check -->
  <ng-container *ngIf="name === 'check'">
    <polyline points="20 6 9 17 4 12"></polyline>
  </ng-container>

  <!-- alert -->
  <ng-container *ngIf="name === 'alert'">
    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
    <line x1="12" y1="9" x2="12" y2="13"></line>
    <line x1="12" y1="17" x2="12.01" y2="17"></line>
  </ng-container>

  <!-- trash -->
  <ng-container *ngIf="name === 'trash'">
    <polyline points="3 6 5 6 21 6"></polyline>
    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
    <line x1="10" y1="11" x2="10" y2="17"></line>
    <line x1="14" y1="11" x2="14" y2="17"></line>
  </ng-container>

  <!-- inbox -->
  <ng-container *ngIf="name === 'inbox'">
    <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline>
    <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
  </ng-container>

  <!-- shield-check -->
  <ng-container *ngIf="name === 'shield-check'">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
    <polyline points="9 12 11 14 15 10"></polyline>
  </ng-container>

  <!-- map-pin -->
  <ng-container *ngIf="name === 'map-pin'">
    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
    <circle cx="12" cy="10" r="3"></circle>
  </ng-container>

  <!-- home -->
  <ng-container *ngIf="name === 'home'">
    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
    <polyline points="9 22 9 12 15 12 15 22"></polyline>
  </ng-container>

  <!-- user -->
  <ng-container *ngIf="name === 'user'">
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
    <circle cx="12" cy="7" r="4"></circle>
  </ng-container>

  <!-- users -->
  <ng-container *ngIf="name === 'users'">
    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
    <circle cx="9" cy="7" r="4"></circle>
    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
  </ng-container>

  <!-- plus -->
  <ng-container *ngIf="name === 'plus'">
    <line x1="12" y1="5" x2="12" y2="19"></line>
    <line x1="5" y1="12" x2="19" y2="12"></line>
  </ng-container>

  <!-- log-out -->
  <ng-container *ngIf="name === 'log-out'">
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
    <polyline points="16 17 21 12 16 7"></polyline>
    <line x1="21" y1="12" x2="9" y2="12"></line>
  </ng-container>

  <!-- heart -->
  <ng-container *ngIf="name === 'heart'">
    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
  </ng-container>

  <!-- file -->
  <ng-container *ngIf="name === 'file'">
    <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
    <polyline points="13 2 13 9 20 9"></polyline>
  </ng-container>

  <!-- upload -->
  <ng-container *ngIf="name === 'upload'">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
    <polyline points="17 8 12 3 7 8"></polyline>
    <line x1="12" y1="3" x2="12" y2="15"></line>
  </ng-container>

  <!-- clock -->
  <ng-container *ngIf="name === 'clock'">
    <circle cx="12" cy="12" r="10"></circle>
    <polyline points="12 6 12 12 16 14"></polyline>
  </ng-container>

  <!-- camera -->
  <ng-container *ngIf="name === 'camera'">
    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
    <circle cx="12" cy="13" r="4"></circle>
  </ng-container>

  <!-- dashboard -->
  <ng-container *ngIf="name === 'dashboard'">
    <rect x="3" y="3" width="7" height="7"></rect>
    <rect x="14" y="3" width="7" height="7"></rect>
    <rect x="14" y="14" width="7" height="7"></rect>
    <rect x="3" y="14" width="7" height="7"></rect>
  </ng-container>

  <!-- eye -->
  <ng-container *ngIf="name === 'eye'">
    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
    <circle cx="12" cy="12" r="3"></circle>
  </ng-container>

  <!-- pencil -->
  <ng-container *ngIf="name === 'pencil'">
    <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
  </ng-container>

  <!-- pause -->
  <ng-container *ngIf="name === 'pause'">
    <rect x="6" y="4" width="4" height="16"></rect>
    <rect x="14" y="4" width="4" height="16"></rect>
  </ng-container>

  <!-- play -->
  <ng-container *ngIf="name === 'play'">
    <polygon points="5 3 19 12 5 21 5 3"></polygon>
  </ng-container>

  <!-- filter -->
  <ng-container *ngIf="name === 'filter'">
    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
  </ng-container>

  <!-- rotate -->
  <ng-container *ngIf="name === 'rotate'">
    <polyline points="23 4 23 10 17 10"></polyline>
    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
  </ng-container>

  <!-- flag -->
  <ng-container *ngIf="name === 'flag'">
    <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
    <line x1="4" y1="22" x2="4" y2="15"></line>
  </ng-container>

  <!-- arrow-left -->
  <ng-container *ngIf="name === 'arrow-left'">
    <line x1="19" y1="12" x2="5" y2="12"></line>
    <polyline points="12 19 5 12 12 5"></polyline>
  </ng-container>

  <!-- calendar -->
  <ng-container *ngIf="name === 'calendar'">
    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
    <line x1="16" y1="2" x2="16" y2="6"></line>
    <line x1="8" y1="2" x2="8" y2="6"></line>
    <line x1="3" y1="10" x2="21" y2="10"></line>
  </ng-container>

  <!-- coins -->
  <ng-container *ngIf="name === 'coins'">
    <circle cx="8" cy="8" r="6"></circle>
    <path d="M18.09 10.37A6 6 0 1 1 10.34 18"></path>
    <line x1="7" y1="6" x2="9" y2="6"></line>
    <line x1="8" y1="6" x2="8" y2="10"></line>
  </ng-container>

  <!-- bell -->
  <ng-container *ngIf="name === 'bell'">
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
  </ng-container>

  <!-- chevron-down -->
  <ng-container *ngIf="name === 'chevron-down'">
    <polyline points="6 9 12 15 18 9"></polyline>
  </ng-container>

  <!-- chat -->
  <ng-container *ngIf="name === 'chat'">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
  </ng-container>

  <!-- key -->
  <ng-container *ngIf="name === 'key'">
    <path d="M21 2l-2 2m-1.5 1.5L14 9m-2-2l2 2m-7 5a5 5 0 1 0 0-7 5 5 0 0 0 0 7zm0 0l-5 5h3v2h2v2h2l2-2"></path>
  </ng-container>
</svg>
