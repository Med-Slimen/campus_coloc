<div class="container not-found-conteneur">
  <div class="card not-found-carte">
    <span class="tag-label statut-danger">ERREUR 404</span>
    <h1 class="code-404 tabular-nums">404</h1>
    <h2 class="titre-404">Page introuvable</h2>
    <p class="desc-404">
      Le document ou l'annonce que vous recherchez semble avoir été déplacé, archivé ou n'existe pas.
    </p>
    <div class="actions-404">
      <a routerLink="/" class="btn btn-primary">
        <app-icon name="home" [size]="16"></app-icon>
        <span>Retour à l'accueil</span>
      </a>
      <a routerLink="/annonces" class="btn btn-secondary">
        <span>Consulter les logements</span>
      </a>
    </div>
  </div>
</div>
