<div class="auth-conteneur">
  <div class="card auth-carte">
    <div class="auth-entete">
      <span class="tag-label">NOUVEAU COMPTE</span>
      <h1 class="auth-titre">Inscription</h1>
      <p class="auth-description">Rejoignez la première communauté de colocation universitaire en Tunisie.</p>
    </div>

    <form (ngSubmit)="sInscrire()" class="auth-formulaire">
      <!-- Message d'erreur explicite en cas d'échec -->
      <div *ngIf="erreur" class="field-error" role="alert">
        <app-icon name="alert" [size]="16"></app-icon>
        <span>{{ erreur }}</span>
      </div>

      <!-- 2 cartes sélectionnables pour choisir le rôle -->
      <div class="form-group">
        <label>CHOISISSEZ VOTRE STATUT</label>
        <div class="cartes-selection-role">
          <button
            type="button"
            class="carte-role"
            [class.carte-role-active]="role === 'etudiant'"
            (click)="role = 'etudiant'"
          >
            <div class="carte-role-icone">
              <app-icon name="user" [size]="22"></app-icon>
            </div>
            <div class="carte-role-info">
              <span class="carte-role-titre">Je suis étudiant</span>
              <span class="carte-role-desc">Je cherche un logement ou une colocation étudiante</span>
            </div>
            <span class="carte-role-coche" *ngIf="role === 'etudiant'">
              <app-icon name="check" [size]="14"></app-icon>
            </span>
          </button>

          <button
            type="button"
            class="carte-role"
            [class.carte-role-active]="role === 'proprietaire'"
            (click)="role = 'proprietaire'"
          >
            <div class="carte-role-icone">
              <app-icon name="home" [size]="22"></app-icon>
            </div>
            <div class="carte-role-info">
              <span class="carte-role-titre">Je suis propriétaire</span>
              <span class="carte-role-desc">Je propose un appartement ou des chambres à louer</span>
            </div>
            <span class="carte-role-coche" *ngIf="role === 'proprietaire'">
              <app-icon name="check" [size]="14"></app-icon>
            </span>
          </button>
        </div>
      </div>

      <!-- Nom complet -->
      <div class="form-group">
        <label for="nom">NOM COMPLET</label>
        <input
          type="text"
          id="nom"
          name="nom"
          [(ngModel)]="nom"
          placeholder="Ex. Youssef Trabelsi"
          required
        />
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">ADRESSE COURRIEL</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="youssef@etudiant-esprit.tn"
          required
        />
      </div>

      <!-- Mot de passe -->
      <div class="form-group">
        <label for="motDePasse">MOT DE PASSE</label>
        <input
          type="password"
          id="motDePasse"
          name="motDePasse"
          [(ngModel)]="motDePasse"
          placeholder="Minimum 6 caractères"
          required
        />
      </div>

      <!-- Confirmation du mot de passe -->
      <div class="form-group">
        <label for="confirmation">CONFIRMATION DU MOT DE PASSE</label>
        <input
          type="password"
          id="confirmation"
          name="confirmation"
          [(ngModel)]="confirmation"
          placeholder="Retapez votre mot de passe"
          required
        />
      </div>

      <!-- Bouton de soumission -->
      <button
        type="submit"
        class="btn btn-primary w-full btn-inscription"
        [disabled]="chargement"
      >
        <app-icon *ngIf="!chargement" name="check" [size]="18"></app-icon>
        <span>{{ chargement ? 'Création de votre compte...' : 'Créer mon compte' }}</span>
      </button>
    </form>

    <div class="auth-pied">
      <span>Vous avez déjà un compte ?</span>
      <a routerLink="/connexion" class="lien-secondaire">Se connecter</a>
    </div>
  </div>
</div>
