<div class="container conteneur-bientot">
  <div class="card carte-bientot">
    <div class="icone-bientot">
      <app-icon name="clock" [size]="40"></app-icon>
    </div>
    <span class="tag-label">EN DÉVELOPPEMENT</span>
    <h1 class="titre-bientot">Disponible bientôt</h1>
    <p class="description-bientot">
      Cette section est actuellement en cours d'écriture pour vous offrir la meilleure expérience de colocation en Tunisie.
    </p>
    <div class="actions-bientot">
      <a routerLink="/" class="btn btn-primary">
        <app-icon name="arrow-left" [size]="16"></app-icon>
        <span>Retour à l'accueil</span>
      </a>
      <a routerLink="/annonces" class="btn btn-secondary">
        <app-icon name="search" [size]="16"></app-icon>
        <span>Voir les annonces</span>
      </a>
    </div>
  </div>
</div>
